[project]
name = "translator"
version = "0.1.0"
description = "Middleware API between 3GPP NEF and the Slice Manager"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.2",
  "httpx>=0.27.0",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.0.0",
  "hypercorn==0.18.0",  # HTTP/1.1 + HTTP/2 cleartext (h2c) for N5 (docs/adr/0002)
]

# Important: NO [build-system] here.
# This means uv will NOT try to build translator as a package.
# It will just manage the env + dependencies.
