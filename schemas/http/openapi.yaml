      parameters:
      - name: scsAsId
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the SCS/AS
          title: Scsasid
        description: Identifier of the SCS/AS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsSessionWithQoSSubscription'
              description: AS session with QoS subscription resource
      responses:
        '201':
          description: Subscription created successfully
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AsSessionWithQoSSubscription'
                - $ref: '#/components/schemas/OperationAccepted'
                title: Response Create Subscription 3Gpp As Session With Qos V1  Scsasid  Subscriptions
                  Post
        '202':
          description: Duplicate request accepted (existing operation returned)
        '400':
          description: Bad request — invalid 3GPP payload; missing or unknown qosReference; snssai/dnn
            not matching the profile's slice
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — the UE already has a QoS session
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Slice Manager unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
      - AS Session with Required QoS Subscriptions
      summary: List all active subscriptions
      description: Return all active subscriptions, optionally filtered by UE IP.
      operationId: list_subscriptions_3gpp_as_session_with_qos_v1__scsAsId__subscriptions_get
      parameters:
