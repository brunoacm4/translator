services:
  nef-translator:
    build:
      # Context is the repository root (one level up from infra/), with a
      # versioned .dockerignore — so a fresh clone builds regardless of path.
      context: ..
      dockerfile: Dockerfile
    image: nef-translator:v0.1.0
    container_name: nef-translator
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SM_BASE_URL: http://10.16.255.55:8000
      # The NEF waits at most 25 s for the PCF (here, the translator). One SM
      # attempt of 15 s keeps every answer under that and still outlasts the
      # SM's own 10 s wait for Kafka. No retry: a timed-out POST may already
      # have reached the SM. See CONSIDERATIONS.md §4.6.
      SM_TIMEOUT: "15.0"
      SM_HEALTH_TIMEOUT: "5.0"
      # true needs an SM with GET /operations (Sept 2026+); use "false" against
      # an older SM build such as the June 2026 sandbox.
      SM_POLLING_ENABLED: "true"
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      CB_FAILURE_THRESHOLD: "5"
      CB_RECOVERY_TIMEOUT: "30.0"
      RETRY_MAX_ATTEMPTS: "1"
      RETRY_MIN_WAIT: "0.5"
      RETRY_MAX_WAIT: "3.0"
      TRANSLATOR_DB_PATH: /data/translator.db
    volumes:
      - translator-data:/data
    # The NEF is configured with its southbound gateway (SGW) at
    # sgw.onemnef.com:8500 (Helm value sgw_host) and is expected to use that
    # name in ascReqData.notifUri. The translator sends the N5 termination
    # request there (ADR 0007), so the name is mapped to the SGW address on
    # NEF-Dev here instead of depending on DNS. Override with NEF_SGW_IP.
    extra_hosts:
      - "sgw.onemnef.com:${NEF_SGW_IP:-10.255.13.14}"

volumes:
  translator-data:
